version: "2"

linters:
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
    staticcheck:
      checks:
        - all
        # Error strings may start with product names such as Codex.
        - -ST1005
        # Defaults of golangci-lint that this project keeps disabled.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

formatters:
  enable:
    - gofmt
