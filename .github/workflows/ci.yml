name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PRETTIER_VERSION: 3.9.10

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npx --yes prettier@${PRETTIER_VERSION} --check "**/*.md"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The supported range of Codex versions; keep in sync with
        # internal/codex/layout.go.
        codex: [0.165.0, 0.166.0, 0.167.0]
    name: test (${{ matrix.os }}, Codex ${{ matrix.codex }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --global @openai/codex@${{ matrix.codex }}
      - run: go test -count=1 ./...
        env:
          AGENT_TELEPORT_E2E_REQUIRED: "1"
