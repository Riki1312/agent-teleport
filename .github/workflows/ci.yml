name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CODEX_VERSION: 0.154.0
  PRETTIER_VERSION: 3.9.10

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npx --yes prettier@${PRETTIER_VERSION} --check "**/*.md"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --global @openai/codex@${CODEX_VERSION}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          CXPORT_E2E_REQUIRED: "1"
