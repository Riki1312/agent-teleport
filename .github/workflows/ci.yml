name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PRETTIER_VERSION: 3.9.10

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npx --yes prettier@${PRETTIER_VERSION} --check "**/*.md"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Each job pairs one version of every provider, covering the
        # supported ranges in internal/codex/layout.go and
        # internal/claude/layout.go.
        agents:
          - { codex: 0.165.0, claude: 2.1.317 }
          - { codex: 0.166.0, claude: 2.1.319 }
          - { codex: 0.167.1, claude: 2.1.322 }
          - { codex: 0.168.0, claude: 2.1.323 }
          - { codex: 0.169.0, claude: 2.1.323 }
    name: test (${{ matrix.os }}, Codex ${{ matrix.agents.codex }}, Claude Code ${{ matrix.agents.claude }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --global @openai/codex@${{ matrix.agents.codex }} @anthropic-ai/claude-code@${{ matrix.agents.claude }}
      - run: go test -count=1 ./...
        env:
          AGENT_TELEPORT_E2E_REQUIRED: "1"
